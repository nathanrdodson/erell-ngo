name: Deploy theme to Ghost (IONOS)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile SCSS
        run: npm run build:css

      - name: Validate theme with gscan
        run: npx --yes gscan --fatal .

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://erell-ngo.nrdod.io
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '74.208.159.184' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      GHOST_PATH: ${{ vars.GHOST_PATH || '/var/www/ghost' }}
      GHOST_SERVICE: ${{ vars.GHOST_SERVICE || 'ghost_erell-ngo' }}
      THEME_NAME: ${{ vars.THEME_NAME || 'erell-ghost-theme' }}
    steps:
      - name: Check deploy configuration
        run: |
          missing=0
          for s in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s is not set"; missing=1; fi
          done
          exit $missing
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile SCSS
        run: npm install --no-audit --no-fund && npm run build:css

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Sync theme files
        run: |
          rsync -az --delete --chown=ghost:ghost \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='www.erell.ngo/' \
            --exclude='assets/css/src/' \
            --exclude='publications.md' \
            --exclude='*.code-workspace' \
            --exclude='.DS_Store' \
            --exclude='.gitignore' \
            ./ "deploy:$GHOST_PATH/content/themes/$THEME_NAME/"

      - name: Upload routes.yaml
        run: |
          rsync -az --chown=ghost:ghost routes.yaml "deploy:$GHOST_PATH/content/settings/routes.yaml"

      - name: Restart Ghost
        run: ssh deploy "systemctl restart '$GHOST_SERVICE' && systemctl is-active '$GHOST_SERVICE'"

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://erell-ngo.nrdod.io/ || true)
            [ "$code" = "200" ] && { echo "Site is up ($code)"; exit 0; }
            echo "Waiting for Ghost (got $code)..."; sleep 5
          done
          echo "::error::Site did not return 200 after restart"; exit 1
